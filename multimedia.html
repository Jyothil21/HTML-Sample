<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>multimedia</title>
</head>
<body>
    <h3>Example of audio tag</h3>
    <audio controls>
        <source src="peace.mp3" type="audio/mp3">
    </audio>
    <h3>Example for video</h3>
    <video controls width="600">
        <source src="sea.mp4" type="video/mp4">
    </video>
    <h3>Example for youtube video</h3>
    <iframe width="857" height="482" src="https://www.youtube.com/embed/HK6B2da3DPA" title="AB de Villiers fastest 100 of all time" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
