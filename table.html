<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table</title>
</head>
<body>
    <h4>Example for html table</h4>
    <table border="1">
        <tr>     <!--table row-->
            <th>SNO:</th>    <!--table header-->
            <th>NAME</th>
            <th>AGE</th>
        </tr>
        <tr>
            <td>001</td>    <!--table data-->
            <td>J</td>
            <td>28</td>
        </tr>
        <tr>
            <td>002</td>
            <td>G</td>
            <td>27</td>
        </tr>
        <tr>
            <td>007</td>
            <td>BOND</td>
            <td>26</td>
        </tr>
    </table>
</body>
</html>
