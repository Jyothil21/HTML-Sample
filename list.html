<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>list</title>
</head>
<body>
    <h3>HTML LISTS</h3>
    <h5>ORDERED LIST</h5>
    <ol type="A">
        <li>MESSI</li>
        <li>NEY</li>
        <li>DIBU</li>
        <li>MAC</li>
    </ol>

    <h5>UNORDERED LIST</h5>
    <ul type="square">
        <li>MESSI</li>   <!--li list item-->
        <li>NEY</li>
        <li>DIBU</li>
        <li>MAC</li>
    </ul>

    <h5>DEFINITION LIST</h5>
    <dl>
        <dt>MESSI</dt>  <!--dt definition term-->
        <dd>GOAT</dd>   <!--dd definition description-->
        <dt>DIBU</dt>
        <dd>EMILIANO MARTINEZ</dd>
    </dl>
</body>
</html>
